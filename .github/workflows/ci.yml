
name: Microservices CI

on:
  push:
    branches:
      - main
    paths:
      - "user-service/**"
      - "course-service/**"
      - "enrollment-service/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - course-service
          - enrollment-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .
